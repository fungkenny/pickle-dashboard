<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Kenny Dashboard 總覽</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f3f5f8; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --line: #e2e8f0; --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1220; --card: #16203a; --text: #e8eefc; --muted: #9aa8c4; --line: #26314e; --accent: #60a5fa; }
    }
    body {
      background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Noto Sans TC", sans-serif;
      padding: 18px 14px 32px; max-width: 640px; margin: 0 auto;
    }
    header { margin-bottom: 18px; }
    h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .card {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .card:active { transform: scale(0.985); box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08); }
    .card-title { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .card-desc { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      font-size: 0.72rem; font-weight: 600; color: var(--accent);
      background: rgba(37, 99, 235, 0.1); border-radius: 999px; padding: 3px 9px;
    }
    .chip.grey { color: var(--muted); background: rgba(100, 116, 139, 0.12); }
    .go { margin-top: 12px; font-size: 0.85rem; font-weight: 700; color: var(--accent); }
    footer { color: var(--muted); font-size: 0.75rem; text-align: center; margin-top: 22px; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <h1>📊 Dashboard 總覽</h1>
    <div class="sub">全部儀表板都喺瀏覽器直接開，互動功能（搜尋／篩選／複製）全部用得。</div>
  </header>

  <a class="card" href="hk-deals-express.html">
    <div class="card-title">🏷️ 香港優惠速遞</div>
    <div class="card-desc">信用卡、外賣、機票酒店、超市同網購優惠，逐項有截止日同優惠碼一鍵複製。</div>
    <div class="meta">
      <span class="chip">50 項有效優惠</span>
      <span class="chip grey">每日 09:30 掃描</span>
    </div>
    <div class="go">打開 →</div>
  </a>

  <a class="card" href="free-resources-dashboard.html">
    <div class="card-title">🛠️ 免費資源與算力</div>
    <div class="card-desc">AI API、雲端主機、GPU、TTS、網站託管，用紅／黃／綠／灰燈號追蹤額度同到期日。</div>
    <div class="meta">
      <span class="chip">40 個資源</span>
      <span class="chip grey">燈號狀態追蹤</span>
    </div>
    <div class="go">打開 →</div>
  </a>

  <footer>
    由 Pickle 每日自動更新 · GitHub Pages<br>
    最後更新：2026-11-28（HKT）
  </footer>
</body>
</html>
